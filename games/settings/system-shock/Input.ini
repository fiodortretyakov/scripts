[/Script/Engine.InputSettings]
; ---- gamepad right stick: VERTICAL ONLY slowed, 2026-08-12 ----
; Sensitivity 0.55 / Exponent 1.3 is applied to Gamepad_RightY ONLY.
; Gamepad_RightX is deliberately left at stock (Sensitivity 1.0, Exponent 1.0),
; so horizontal turning speed is unchanged and only vertical aim is calmed down.
; Relative to stock, Y is now ~1.8x slower at full deflection.
;
; History, and why X is not touched this time: an earlier pass set BOTH axes to
; 0.55 / 1.3. That was reverted because the result read as too SLOW overall - the
; complaint was never about horizontal. Splitting the axes is the fix: vertical
; needs far less travel than horizontal, so it can be slower without making the
; whole stick feel sluggish.
;
; The game exposes no look-sensitivity slider at all - verified by dumping
; ShockSettings.sav, which holds only FOV, brightness, volume, the quality tiers
; and the keybind maps. So this file is the ONLY place look speed can be changed.
;
; To tune: Sensitivity < 1.0 slower, > 1.0 faster. If 0.55 reads too slow, go 0.7
; then 0.85 - change Sensitivity only and leave Exponent alone.
; Exponent > 1.0 gives finer control near centre, which is what you want on the
; vertical axis specifically.
; DeadZone must stay in the struct - omitting it resets it to 0 and the stick drifts.
; Appended entries win: UInputSettings keeps the LAST match per AxisKeyName, and
; this file is the highest-priority config layer over the cooked DefaultInput.ini.
;
; Mouse look is a DIFFERENT axis (MouseY) and is not affected by the line below.
+AxisConfig=(AxisKeyName="Gamepad_RightY",AxisProperties=(DeadZone=0.25,Exponent=1.6,Sensitivity=0.45,bInvert=False))

; ---- 2026-08-30: vertical still read as too fast, second pass ----
; Sensitivity 0.55 -> 0.45 and Exponent 1.3 -> 1.6 on Gamepad_RightY only.
; Exponent is the "smoothness" lever: 1.6 means a half-deflected stick moves at
; ~0.33 of full speed instead of ~0.41, so small corrections are much gentler
; while a full flick still reaches the top of its range.
; Backup of the 0.55/1.3 version: Input.ini.bak-2026-08-30.
; If 0.45 now overshoots the other way (cannot look up fast enough), raise
; Sensitivity back to 0.55 and keep Exponent 1.6.
