[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+TargetedRHIs=PCD3D_SM6

[/Script/Engine.RendererSettings]
r.Nanite.ProjectEnabled=False
r.DynamicGlobalIlluminationMethod=2
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0

[SystemSettings]
; ===== CRASH-SAFETY LOCKS - Nanite-off REQUIRES VSM-off =====
r.Nanite=0
r.Nanite.ProjectEnabled=0
r.Nanite.ProxyRenderMode=0
r.Shadow.Virtual.Enable=0
; ===== Lumen / RayTracing stay OFF =====
r.DynamicGlobalIlluminationMethod=2
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.Reflections.Allow=0
r.SSGI.Quality=2
r.RayTracing=0
; ===== render resolution (sharper than demo 62) =====
r.ScreenPercentage=100
r.TemporalAA.Upsampling=1
; ===== output resolution: 50 % = 2560x720 rendered, exact 2x upscale to 5120x1440 (HUD stays native); 1 Nov: 40 % = 25-30 FPS, 67 % = 20 (GPU 100 % busy), 75 % = 9-10 (RAM ran out) =====
r.SecondaryScreenPercentage.GameViewport=50
; ===== STEP D, 4 Oct 2026: torch/campfire cube shadows off (6 scene redraws each = camp dips); caches up (GPU uses ~3 of 15.8 GB): pool 6 GB, shadow cache 2 GB, skin cache 512 MB; FOV 70 -> 62. NEVER r.CreateShadersOnLoad=1: startup crash on Adreno (unable to create a shader) in GameUserSettings =====
r.AllowPointLightCubemapShadows=0
; final 2x upscale: 4 = Lanczos (sharpest, 1 Nov 2026), 3 = Catmull-Rom
r.Upscale.Quality=4
; ===== STEP A, 4 Oct 2026 (target ~30 avg, dips to 20 accepted): near-free look effects on top of step 3 =====
; full filmic tonemapper: contrast, vignette, shadow tint (the Low group sets basic only)
; ROUND J: tonemapper 5 -> 1 = film contrast kept, vignette + shadow tint off (vignette darkens the outer thirds of 32:9)
r.Tonemapper.Quality=1
; auto exposure (caves, interiors)
r.EyeAdaptationQuality=2
; bloom kernel at its authored size (Low = 0.6)
r.Filter.SizeScale=1
r.Tonemapper.Sharpen=2.0
; ===== high-precision HDR scene color - kills sky/fog gradient banding =====
r.SceneColorFormat=3
; ===== HDR UI luminance - dims edge-locked HUD ~20% on the 1000-nit 57" panel =====
r.HDR.UI.Level=0.8
; ROUND J/K, 4 Oct 2026: brighter mid-tones in HDR (UE default 15 nits; J=20 liked, K=25 "more HDR tone"), highlights unchanged
r.HDR.Display.MidLuminance=45
r.HDR.Aces.SceneColorMultiplier=1.6
; ===== crisp textures + 8x anisotropic =====
r.Streaming.PoolSize=12288
r.Streaming.LimitPoolSizeToVRAM=0
r.Streaming.MaxTempMemoryAllowed=50
r.Streaming.HiddenPrimitiveScale=1
r.MipMapLODBias=-0.75
; STEP E, 4 Oct 2026 (on GOLDEN-2026-10-04): per-pixel beauties, cheap because 3D pixels barely cost here - AF 8, skin SSS, TAA quality 2 (GameUserSettings)
r.MaxAnisotropy=8
; ===== mesh / character detail =====
r.ViewDistanceScale=0.6
; STEP F: FOV 62 -> 51 makes objects ~1.26x larger on screen; scale LOD distance to keep the FOV-62 detail (invisible saving)
; 5 Oct 2026: FOV 51 -> 45 (100 cm seating), LOD scale 1.9 -> 2.2 (x tan25.5/tan22.5 = 1.15, same detail as at 51)
r.StaticMeshLODDistanceScale=2.18
; ROUND H, 4 Oct 2026: characters at full detail (faces, armour in dialogues); skin cache 512 MB carries it
r.SkeletalMeshLODBias=0
; ===== foliage / grass =====
foliage.DensityScale=0.12
foliage.LODDistanceScale=0.6
grass.DensityScale=0.15
grass.CullDistanceScale=0.7
; ===== shadows (CSM only, VSM off) - sharper than demo =====
; STEP B, 4 Oct 2026: sharper, softer-edged sun shadows (were 384 px, filter 2)
r.ShadowQuality=4
r.Shadow.MaxResolution=512
r.Shadow.MaxCSMResolution=1024
r.Shadow.RadiusThreshold=0.08
; STEP 3, 4 Oct 2026: sun shadows only near the player (was 0.35) - measures the shadow cost
r.Shadow.DistanceScale=0.25
r.Shadow.CSM.MaxCascades=1
r.Shadow.CSM.TransitionScale=1.0
r.MinScreenRadiusForCSMDepth=0.03
r.MinScreenRadiusForDepthPrepass=0.05
r.MinScreenRadiusForLights=0.05
; ===== screen-space reflections (water) =====
r.ReflectionMethod=2
; ROUND I, 4 Oct 2026: screen-space reflections on shiny surfaces and water only (roughness <= 0.4)
r.SSR.Quality=3
; 30 Oct: SSR reads half-res scene color (engine help: faster, little visual loss)
r.SSR.HalfResSceneColor=1
r.SSR.MaxRoughness=0.6
r.Water.SingleLayer.Reflection=1
; 30 Oct: water refraction buffer at half resolution (murky swamp water hides it)
r.Water.SingleLayer.RefractionDownsampleFactor=2
r.Water.SingleLayer.TiledComposite=1
; ===== misc quality =====
r.SSS.Quality=0
r.SSS.HalfRes=0
; ROUND H cut: bloom 5 -> 4 drops only the widest, faintest bloom pass; the lens streak stays
r.BloomQuality=5
r.Bloom.ScreenPercentage=100
; ROUND I: light ambient occlusion - classic SSAO (cheaper than GTAO), 1 level, capped quality
r.AmbientOcclusionLevels=3
r.AmbientOcclusionMaxQuality=100
r.AmbientOcclusionRadiusScale=0.8
r.AmbientOcclusion.Method=1
r.GTAO.Downsample=1
r.GTAO.NumAngles=2
r.TranslucencyLightingVolumeDim=32
; ===== VRS: driver 31.0.178.0 reports Tier 2; contrast adaptive shading (30 Oct, untested) =====
r.VRS.Enable=1
r.VRS.EnableImage=1
r.VRS.ContrastAdaptiveShading=1
; ===== kept off =====
r.MotionBlurQuality=2
; 30 Oct: blur length is percent of screen WIDTH - 2.5 on 32:9 = UE's 16:9 default of 5
r.MotionBlur.Max=2.5
r.DepthOfFieldQuality=2
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=24
; 31 Oct: fog kept cheap in dialogues - shadowed lights via the shared pass, no 4x re-render after camera cuts
r.VolumetricFog.InjectShadowedLightsSeparately=0
r.VolumetricFog.HistoryMissSupersampleCount=1
; fog: half the depth slices (31 Oct, swamp faster); 1 Nov TEST at 50 %: grid 40 -> 24 = 107x30 cells instead of 64x18 (sharper sun beams, torch glow)
r.VolumetricFog.GridSizeZ=32
r.Fog=1
r.VolumetricCloud=1
r.VolumetricCloud.ViewRaySampleMaxCount=384
r.DistanceFieldAO=0
r.DistanceFieldShadowing=0
r.HZBOcclusion=1
; ROUND H: fine contact shadows where feet/objects meet the ground (per-pixel = cheap here)
r.ContactShadows=1
r.Streaming.FullyLoadUsedTextures=0
r.CapsuleDirectShadows=1
r.CapsuleShadows=1
; 30 Oct: character capsule shadows reach halved from UE defaults 400/200 (engine help: big impact on performance)
r.CapsuleMaxDirectOcclusionDistance=200
r.CapsuleMaxIndirectOcclusionDistance=100
r.FilmGrain=0
r.HairStrands.Enable=0
r.LightShaftQuality=1
; ROUND H: small props and decorations back (DetailMode 0 strips them)
r.DetailMode=3
r.SceneColorFringeQuality=0
r.SeparateTranslucency=1
r.SeparateTranslucencyScreenPercentage=50
r.ParticleLightQuality=1
r.LightFunctionQuality=1
r.Shadow.MaxNumPointShadowCacheUpdatesPerFrame=1
r.Shadow.WholeSceneShadowCacheMb=2048
r.Shadow.MaxNumSpotShadowCacheUpdatesPerFrame=1
r.SkinCache.SceneMemoryLimitInMB=512
r.SkinCache.CompileShaders=1
r.SkinCache.RecomputeTangents=2
a.URO.Enable=1
r.ParallelPrePass=1
r.ParallelBasePass=1
r.ParallelShadows=1
r.ParallelTranslucency=1
r.Shadow.CacheWholeSceneShadows=1
r.RefractionQuality=2
r.SkyAtmosphere.SampleCountMax=32
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=32
r.SkyAtmosphere.AerialPerspectiveLUT.SampleCountMaxPerSlice=2
r.RHICmdBypass=0
r.OneFrameThreadLag=1
r.MeshDrawCommands.DynamicInstancing=1
; 30 Oct: TAA quality 2 back (less foliage shimmer) - removing it did not fix dialogues
r.TemporalAA.Quality=2
r.TemporalAACurrentFrameWeight=0.12
gc.TimeBetweenPurgingPendingKillObjects=120
r.GTSyncType=1
fx.NiagaraAllowGPUParticles=1
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.StartupMode=1
; ===== D3D12 PSO disk cache - revisiting an area no longer re-stutters =====
D3D12.PSO.DiskCache=1
D3D12.PSO.DriverOptimizedDiskCache=1
; ===== runtime PSO precaching - kills first-encounter shader-compile hitches =====
r.PSOPrecaching=1
r.PSOPrecache.ProxyCreationWhenPSOReady=1
; ===== persist the learned PSO cache more often (survives crashes) =====
r.ShaderPipelineCache.SaveAfterPSOsLogged=25
; ===== dedicated async asset-loading thread (smoother streaming) =====
s.AsyncLoadingThreadEnabled=1
s.AsyncLoadingUseFullTimeLimit=0
; ===== ROUND G, 4 Oct 2026: spread loading work over more frames (the dips are CPU-side load spikes); RAM is plentiful =====
s.LevelStreamingComponentsRegistrationGranularity=5
s.LevelStreamingComponentsUnregistrationGranularity=3
s.UnregisterComponentsTimeLimit=0.5
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.MaxNumTexturesToStreamPerFrame=4
r.DynamicRes.OperationMode=0
; ===== VSync on a 60 Hz panel: present every 2nd refresh = even 30 FPS, no tearing =====
rhi.SyncInterval=2
r.DynamicRes.FrameTimeBudget=33.3
r.DynamicRes.MinScreenPercentage=36
r.DynamicRes.MaxScreenPercentage=62
r.SkinCache.Mode=1
r.LensFlareQuality=2
a.Budget.Enabled=1
a.Budget.BudgetMs=4.0
; STEP F, 4 Oct 2026: distant torches/campfires light up at night (cheap: torch shadows are off)
r.LightMaxDrawDistanceScale=1.0
r.MaterialQualityLevel=1
